# Tiny teacher-student task used by the unit/integration tests (no download, seconds).
name: synthetic_test
output_root: .
num_threads: 1

task:
  name: synthetic
  n_accept: 300
  n_dev: 300
  n_train_eval: 300
  synthetic: {input_dim: 20, num_classes: 4, teacher_hidden: 32, n_train: 3000, n_test: 500, seed: 0}

model: {name: mlp, hidden: [16, 8]}

population:
  name: synthetic
  n_groups: 6
  total_steps: 300
  workers: 1
  optimizer: {lr: 0.003, weight_decay: 0.0001, batch_size: 32}
  checkpoints: {first: 25, growth: 2.0, linear_every: 100, history_lags: [10, 25], ema_decays: [0.9, 0.99]}
  branching: {every_n_anchors: 1, min_step: 50, n_branches: 2, horizons: [20, 50]}
  split: {train: 0.5, val: 0.25, test: 0.25, seed: 0}

transitions: {max_horizon: 200}

operator: {steps: 60, eval_every: 30, coords_per_transition: 256, transitions_per_batch: 8, hidden: [16, 16]}

evaluation:
  horizons: [20, 50]
  max_sources_per_root: 2
  reference_multiple: 2
  reference_eval_every: 10
  bootstrap_samples: 200
  interleaved: {adam_steps: 50, cycles: 3, horizon: 50, reference_multiple: 2, start_steps: [50]}
